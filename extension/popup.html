<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job App Clipboard Kit</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>Job App Clipboard Kit</h1>
        <p id="mode-hint">Click any value to copy</p>
      </div>
      <button id="settings-button" class="settings-button" type="button" title="Open settings" aria-label="Open settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.97 4.6 1.7 1.7 0 0 0 10 3.08V3h4v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9 1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"></path>
        </svg>
      </button>
    </header>

    <section id="resume-preview-view" class="resume-preview-view" aria-label="Resume preview" hidden>
      <div id="resume-preview-body" class="resume-preview-body">
        <div id="resume-preview-page" class="resume-preview-page">
          <canvas id="resume-preview-canvas" class="resume-preview-canvas" role="img" aria-label="Resume PDF page 1"></canvas>
          <div id="resume-preview-text" class="resume-preview-text" aria-label="Selectable resume text"></div>
        </div>
        <p id="resume-preview-error" class="resume-preview-error" hidden>Could not load the resume preview.</p>
      </div>
    </section>

    <main id="profile" aria-live="polite">
      <div id="profile-sections"></div>
      <section id="resume-section" class="section resume-section" aria-labelledby="resume-title">
        <div class="section-heading resume-heading">
          <h2 id="resume-title" class="section-title">Resume/CV</h2>
          <button id="resume-preview-button" class="secondary-button compact-button" type="button" hidden>Preview</button>
        </div>
        <label id="resume-upload-area" class="resume-upload-area" for="resume-file">
          <span class="resume-upload-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7 3h7l4 4v14H7V3Z"></path>
              <path d="M14 3v5h5M9.5 14.5h5M12 12v5"></path>
            </svg>
          </span>
          <span class="resume-upload-copy">
            <strong id="resume-upload-title">Upload resume PDF</strong>
            <span id="resume-upload-detail">Choose a PDF or drop it here</span>
          </span>
        </label>
        <input id="resume-file" type="file" accept="application/pdf,.pdf" hidden>
      </section>
    </main>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog">
        <div class="settings-dialog-heading">
          <h2 id="settings-title">Settings</h2>
          <button class="dialog-close-button" type="submit" value="cancel" aria-label="Close settings">×</button>
        </div>
        <div class="settings-options">
          <label class="settings-option" for="dark-mode-toggle">
            <span class="settings-option-copy">
              <h3>Dark mode</h3>
              <p>Use a darker palette throughout the clipboard panel.</p>
            </span>
            <span class="toggle-switch">
              <input id="dark-mode-toggle" type="checkbox" role="switch">
              <span class="toggle-track" aria-hidden="true"></span>
            </span>
          </label>
          <div class="settings-option">
            <div class="settings-option-copy">
              <h3>Export profile</h3>
              <p>Download the currently saved profile as a JSON backup.</p>
            </div>
            <button id="export-button" class="secondary-button" type="button">Export</button>
          </div>
          <div class="settings-option">
            <div class="settings-option-copy">
              <h3>Import profile</h3>
              <p>Choose a JSON backup to replace the saved profile.</p>
            </div>
            <button id="import-button" class="primary-button" type="button">Import</button>
          </div>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </form>
    </dialog>
    <script src="popup.js"></script>
  </body>
</html>
