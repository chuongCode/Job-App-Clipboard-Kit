name: Deploy website and extension distribution to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "distribution/**"
      - ".github/workflows/deploy-distribution-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Assemble static site
        run: |
          mkdir _site
          cp -R website/. _site/
          cp distribution/updates.json _site/updates.json
          cp -R distribution/releases _site/releases
      - name: Upload website and distribution
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
