name: Deploy extension distribution to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "distribution/**"
      - ".github/workflows/deploy-distribution-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload distribution directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: distribution
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
